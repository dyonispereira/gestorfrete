        sync_record_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/SyncItemResult" }
      required: [sync_record_id, results]

    SyncRecord:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        session_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        started_at: { type: string, format: date-time, readOnly: true }
        finished_at: { type: string, format: date-time, readOnly: true }
        duration_ms: { type: integer, readOnly: true }
        command_count: { type: integer, readOnly: true }
        success_count: { type: integer, readOnly: true }
        failure_count: { type: integer, readOnly: true }
      required: [id, session_id, started_at, finished_at, command_count, success_count, failure_count]

    DigitalSignature:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        document_type: { type: string, enum: [CANHOTO], readOnly: true }
        document_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        signatory_role: { type: string, enum: [MOTORISTA, CLIENTE, RECEBEDOR], readOnly: true }
        signatory_name: { type: string, readOnly: true }
        file_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        captured_at: { type: string, format: date-time, readOnly: true }
        received_at: { type: string, format: date-time, readOnly: true }
      required: [id, document_type, document_id, signatory_role, file_id, captured_at, received_at]

    # -------------------------------------------------------------------------
    # Lote 11 — BI (analytics + reporting) — components/bi-schemas.md
    # -------------------------------------------------------------------------
    Metric:
      type: object
      description: "D155 — versionada, fórmula histórica nunca sobrescrita."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        formula: { type: string, readOnly: true }
        version: { type: integer, readOnly: true }
        temporal_granularity: { type: string, enum: [DIARIO, SEMANAL, MENSAL, POR_EVENTO] }
        dimensional_granularity: { type: string, enum: [VIAGEM, VEICULO, MOTORISTA, CLIENTE, TENANT] }
        unit: { type: string }
        data_sources: { type: object }
        calculation_periodicity: { type: string, enum: [TEMPO_REAL, INCREMENTAL, DIARIO, MANUAL] }
        status: { type: string, enum: [ATIVA, DESCONTINUADA] }
      required: [id, name, formula, version, temporal_granularity, dimensional_granularity, unit, calculation_periodicity, status]

    ConsolidatedIndicator:
      type: object
      description: "Todo campo readOnly — nunca aceita fórmula/valor digitado (D156)."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        metric_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        metric_version: { type: integer, readOnly: true }
        dimension_type: { type: string, readOnly: true }
        dimension_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        reference_period: { type: string, readOnly: true }
        value: { type: string, readOnly: true }
        calculated_at: { type: string, format: date-time, readOnly: true }
        status: { type: string, enum: [VALIDO, RECALCULADO, SNAPSHOTADO], readOnly: true }
      required: [id, metric_id, metric_version, dimension_type, dimension_id, reference_period, value, calculated_at, status]

    AnalyticalSnapshot:
      type: object
      description: "Imutável após CONSOLIDADO (D151)."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        reference_period: { type: string }
        consolidated_at: { type: string, format: date-time, readOnly: true }
        processing_origin: { type: string, enum: [AUTOMATICO, MANUAL], readOnly: true }
        user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        participating_metrics:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              metric_id: { $ref: "#/components/schemas/UUID" }
              metric_version: { type: integer }
        indicator_ids:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [EM_PROCESSAMENTO, CONSOLIDADO, INVALIDO], readOnly: true }
      required: [id, reference_period, processing_origin, status]

    AnalyticsCube:
      type: object
      description: "Só a definição estrutural — nunca dado materializado nem infraestrutura de execução."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        dimensions: { type: array, items: { type: string } }
        metric_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        status: { type: string, enum: [ATIVO, INATIVO] }
      required: [id, name, dimensions, metric_ids, status]

    Dashboard:
      type: object
      description: "D152 — nunca guarda valor de KPI, só configuração/referência."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        name: { type: string }
        layout: { type: object }
        widgets:
          type: array
          items:
            type: object
            properties:
              metric_id: { $ref: "#/components/schemas/UUID" }
              indicator_id: { $ref: "#/components/schemas/UUID" }
              visualization_type: { type: string }
        filters: { type: object }
        sharing: { type: string, enum: [PRIVADO, COMPARTILHADO_COM_GRUPO, COMPARTILHADO_COM_PAPEL] }
        preferences: { type: object }
        status: { type: string, enum: [ATIVO, ARQUIVADO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, user_id, name, layout, widgets, status, audit]

    SavedFilter:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        name: { type: string }
        criteria: { type: object }
        status: { type: string, enum: [ATIVO, ARQUIVADO] }
      required: [id, user_id, name, criteria, status]

    SavedReport:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        name: { type: string }
        metric_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        filters: { type: object }
        output_format: { type: string, enum: [PDF, EXCEL, CSV] }
        status: { type: string, enum: [ATIVO, ARQUIVADO] }
      required: [id, user_id, name, metric_ids, output_format, status]

    Export:
      type: object
      description: "D157 — contexto completo sempre presente. D307/D308 — assíncrona, arquivo em Storage."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        saved_report_id: { $ref: "#/components/schemas/UUID" }
        user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        filters_used: { type: object, readOnly: true }
        period: { type: string, readOnly: true }
        metric_versions:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              metric_id: { $ref: "#/components/schemas/UUID" }
              version: { type: integer }
        file_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        error_message: { type: string, readOnly: true }
        requested_at: { type: string, format: date-time, readOnly: true }
        status: { type: string, enum: [PROCESSANDO, CONCLUIDA, FALHOU], readOnly: true }
      required: [id, user_id, filters_used, period, metric_versions, requested_at, status]

    ScheduledUpdate:
      type: object
      description: "D159 — nunca calcula, só solicita/define política."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        metric_id: { $ref: "#/components/schemas/UUID" }
        cube_id: { $ref: "#/components/schemas/UUID" }
        mode: { type: string, enum: [TEMPO_REAL, INCREMENTAL, DIARIO, MANUAL] }
        status: { type: string, enum: [ATIVO, INATIVO] }
      required: [id, mode, status]

    # -------------------------------------------------------------------------
    # Lote 11 — IA (ai) — components/ai-schemas.md
    # -------------------------------------------------------------------------
    AIModel:
      type: object
      description: "D169 — múltiplos modelos ativos simultaneamente é o esperado. D170/D309 — logical_provider nunca é o nome do provedor real."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        type: { type: string, enum: [CLASSIFICACAO, PREDICAO, OTIMIZACAO, VISAO_COMPUTACIONAL, GERACAO_DE_TEXTO] }
        version: { type: string }
        logical_provider: { type: string, enum: [INTERNO, PROVEDOR_EXTERNO] }
        capability: { type: string }
        max_context: { type: integer }
        status: { type: string, enum: [EM_TREINAMENTO, ATIVO, DESCONTINUADO] }
      required: [id, name, type, version, logical_provider, capability, status]

    AIInference:
      type: object
      description: "D172 — auditável: entrada, saída, modelo, versão, duração, custo, origem sempre presentes."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        model_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        model_version: { type: string, readOnly: true }
        input: { type: object, readOnly: true }
        output: { type: object, readOnly: true }
        confidence_level: { type: number, readOnly: true, description: "D168 — sempre estatístico, nunca certeza." }
        started_at: { type: string, format: date-time, readOnly: true }
        finished_at: { type: string, format: date-time, readOnly: true }
        duration_ms: { type: integer, readOnly: true }
        cost: { type: string, readOnly: true, description: "Só visível com ai.inference.view_cost." }
        attempt_number: { type: integer, readOnly: true }
        origin: { type: string, enum: [AUTOMATICO, MANUAL], readOnly: true }
        status: { type: string, enum: [SUCESSO, FALHA, TIMEOUT], readOnly: true }
      required: [id, model_id, model_version, started_at, origin, status]

    AISuggestion:
      type: object
      description: "D310 — produto derivado da Inferência, nunca fundido com ela. D311 — decisão nunca executa comando operacional diretamente."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        inference_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        category: { type: string, readOnly: true }
        target_entity_type: { type: string, readOnly: true }
        target_entity_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        recommendation: { type: string, readOnly: true }
        justification: { type: string, readOnly: true, description: "D162 — explicabilidade sempre presente." }
        confidence_level: { type: number, readOnly: true }
        status: { type: string, enum: [PENDENTE, ACEITA, REJEITADA, IGNORADA, EXPIRADA], readOnly: true }
        decision_user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        decided_at: { type: string, format: date-time, readOnly: true }
      required: [id, inference_id, category, target_entity_type, target_entity_id, recommendation, justification, confidence_level, status]

    AIPrediction:
      type: object
      description: "D163/D312 — validade temporal sempre presente. Nunca registra o resultado real (AIFeedback.actual_result, D192)."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        inference_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        category: { type: string, readOnly: true }
        target_entity_type: { type: string, readOnly: true }
        target_entity_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        predicted_value: { type: string, readOnly: true }
        confidence_level: { type: number, readOnly: true }
        valid_until: { type: string, format: date-time, readOnly: true }
        status: { type: string, enum: [ATUAL, EXPIRADA], readOnly: true }
      required: [id, inference_id, category, target_entity_type, target_entity_id, predicted_value, confidence_level, valid_until, status]

    AIClassification:
      type: object
      description: "Enum fechado — Risco/Prioridade/Gravidade. Anomalia é entidade própria (AIAnomaly), nunca confundida (D076)."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        inference_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        classification_type: { type: string, enum: [RISCO, PRIORIDADE, GRAVIDADE], readOnly: true }
        target_entity_type: { type: string, readOnly: true }
        target_entity_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        label: { type: string, readOnly: true }
        confidence_level: { type: number, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [id, inference_id, classification_type, target_entity_type, target_entity_id, label, confidence_level, created_at]

    AIAnomaly:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        inference_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        source_reading_type: { type: string, readOnly: true, enum: [POSICAO_VEICULO, LEITURA_TELEMETRIA, MEDICAO_PNEU] }
        source_reading_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        confidence_level: { type: number, readOnly: true }
        status: { type: string, enum: [ABERTA, INVESTIGADA, DESCARTADA] }
      required: [id, inference_id, source_reading_type, source_reading_id, confidence_level, status]

    ComputerVisionReading:
      type: object
      description: "D161/D164 — resultado é sempre proposta, nunca aplicado automaticamente."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        inference_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        source_file_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        reading_type: { type: string, enum: [CANHOTO, AVARIA, MARCA_DE_FOGO, IMPLEMENTO], readOnly: true }
        analyzed_region: { type: object, readOnly: true }
        extracted_result: { type: object, readOnly: true }
        confidence_level: { type: number, readOnly: true }
        human_review_required: { type: boolean, readOnly: true }
        status: { type: string, enum: [PROCESSADA, CONFIRMADA, REJEITADA] }
        confirmation_user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
      required: [id, inference_id, source_file_id, reading_type, extracted_result, confidence_level, human_review_required, status]

    AIFeedback:
      type: object
      description: "D165 — matéria-prima para evolução dos modelos, nunca altera a decisão original."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        output_type: { type: string, enum: [SUGESTAO, PREDICAO, CLASSIFICACAO, ANOMALIA, LEITURA_VISAO_COMPUTACIONAL], readOnly: true }
        output_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        user_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        result: { type: string, enum: [ACEITO, REJEITADO, IGNORADO] }
        justification: { type: string }
        actual_result: { type: string, description: "D192 — pode ser enviado depois, via PATCH." }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [id, output_type, output_id, user_id, result, created_at]

    # -------------------------------------------------------------------------
    # Lote 12 — Recursos Transversais — components/transversal-schemas.md
    # -------------------------------------------------------------------------
    File:
      type: object
      description: "D315/D324 — metadados do arquivo, distinto do mecanismo de Storage."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        hash: { type: string, readOnly: true }
        version: { type: integer, readOnly: true }
        previous_file_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        origin: { type: string, enum: [UPLOAD_DIRETO, GERADO_PELO_SISTEMA, IMPORTADO], readOnly: true }
        status: { type: string, enum: [ATIVO, EXCLUIDO], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
      required: [id, name, mime_type, size_bytes, hash, version, origin, status, created_at]

    Attachment:
      type: object
      description: "D186/D316 — infraestrutura polimórfica compartilhada; dono sempre resolvido pelo path."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        attachment_type: { type: string }
        file_id: { $ref: "#/components/schemas/UUID" }
        description: { type: string }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, attachment_type, file_id, audit]

    Comment:
      type: object
      description: "D186/D316 — mesma infraestrutura compartilhada de Attachment."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        text: { type: string }
        visible_to_client: { type: boolean }
        author_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, text, visible_to_client, author_id, audit]

    Notification:
      type: object
      description: "D320 — efeito colateral de um evento de domínio, nunca a origem de uma nova decisão."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        channel: { type: string, enum: [IN_APP, PUSH, EMAIL], readOnly: true }
        origin_event_type: { type: string, readOnly: true }
        entity_type: { type: string, readOnly: true }
        entity_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        title: { type: string, readOnly: true }
        message: { type: string, readOnly: true }
        status: { type: string, enum: [NAO_LIDA, LIDA], readOnly: true }
        sent_at: { type: string, format: date-time, readOnly: true }
        read_at: { type: string, format: date-time, readOnly: true }
      required: [id, channel, origin_event_type, title, message, status, sent_at]

    ChannelPreference:
      type: object
      properties:
        channel: { type: string, enum: [IN_APP, PUSH, EMAIL], readOnly: true }
        enabled: { type: boolean }
      required: [channel, enabled]

    IntegrationConfig:
      type: object
      description: "D321 — contrato único, nunca uma API diferente por fornecedor."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type: { type: string }
        credential_file_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        status: { type: string, enum: [ATIVA, INATIVA, COM_ERRO], readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, type, credential_file_id, status, audit]

    Webhook:
      type: object
      description: "D111/D138 — entrega idempotente, reprocessável sem efeito colateral."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        integration_config_id: { $ref: "#/components/schemas/UUID" }
        target_url: { type: string, format: uri }
        subscribed_events: { type: array, items: { type: string } }
        signing_secret: { type: string, description: "Só presente na resposta do POST de criação." }
        status: { type: string, enum: [ATIVO, INATIVO, SUSPENSO], readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, target_url, subscribed_events, status, audit]

    JobExecution:
      type: object
      description: "D037 — histórica, nunca editada após criada. D322 — job_type sempre de um vocabulário já registrado no Backend."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        job_type: { type: string, readOnly: true }
        started_at: { type: string, format: date-time, readOnly: true }
        finished_at: { type: string, format: date-time, readOnly: true }
        result: { type: string, enum: [SUCESSO, FALHA], readOnly: true }
      required: [id, job_type, started_at]

    Tenant:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        razao_social: { type: string }
        cnpj: { type: string }
        status: { type: string, enum: [TRIAL, ATIVO, SUSPENSO, CANCELADO], readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, razao_social, cnpj, status, audit]

    Session:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        status: { type: string, enum: [ATIVA, EXPIRADA, ENCERRADA] }
      required: [id, started_at, expires_at, status]
