openapi: 3.1.0
info:
  title: GestorFrete API
  version: "1.0.0"
  description: >
    Contrato oficial da API do GestorFrete (D210 — OpenAPI é a fonte oficial do contrato).
    Este arquivo cobre apenas Sprint 10 / API Lote 2 (Core, Identidade, Tenancy) — Authentication,
    Tenants, Users, Roles, Permissions, Branches. Nenhum módulo de negócio (Viagens, Frota,
    Financeiro, Fiscal, Manutenção) está incluído ainda; entram em lotes subsequentes.
  contact:
    name: GestorFrete
servers:
  - url: https://api.gestorfrete.com.br/api/v1
    description: Produção
  - url: https://api.staging.gestorfrete.com.br/api/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Login, sessão, recuperação de senha (identity_access).
  - name: Tenants
    description: Dados da empresa do tenant autenticado (tenancy).
  - name: Users
    description: Usuários da transportadora (identity_access).
  - name: Roles
    description: Papéis de RBAC (identity_access).
  - name: Permissions
    description: Catálogo de permissões, Platform Reference Data (identity_access).
  - name: Branches
    description: Filiais do tenant (tenancy).
  - name: Clients
    description: Clientes da transportadora (crm).
  - name: Suppliers
    description: Fornecedores — oficina, posto, seguradora, borracharia, guincho, autopeças, etc., um único recurso (maintenance).
  - name: Drivers
    description: Motoristas (drivers).
  - name: Employees
    description: Funcionários internos, distintos de Motorista e de Usuário (identity_access).
  - name: Addresses
    description: Sub-recurso compartilhado de Cliente/Fornecedor/Filial, nunca um recurso de topo (D182/D225/D231).
  - name: Contacts
    description: Sub-recurso exclusivo de Cliente, não polimórfico (crm).
  - name: CostCenters
    description: Centros de custo, cadastro mestre puro — sem saldo/indicador (financial, D090).
  - name: Trips
    description: Viagem — primeiro Aggregate Root complexo do contrato (freight, core domain).
  - name: TripDeliveries
    description: Entregas e Canhoto — sub-recursos de Viagem, nunca criados de forma independente (freight).
  - name: TripResources
    description: Alocação de recursos da Viagem — pacote atômico Motorista+Veículo+Implemento (D188).
  - name: TripOccurrences
    description: Ocorrências da Viagem — uma única entidade para todo tipo (D076).
  - name: TripTimeline
    description: Projeção de leitura fundida — nunca uma tabela própria (D187/D022).
  - name: Vehicles
    description: Veículos Tracionadores — identidade/técnico/operacional separados (fleet).
  - name: VehicleDocuments
    description: Documentos do veículo — sub-recurso, referencia Storage (D251, fleet).
  - name: Implements
    description: Implementos — entidade independente de Composição (fleet).
  - name: VehicleCompositions
    description: Cavalo + Implemento(s) com vigência — nunca editado in-place (D248/D249, fleet).
  - name: OdometerReadings
    description: Leituras de hodômetro — Time Series imutável (D191/D246, fleet).
  - name: VehicleAvailability
    description: Read Model puro — sem comandos de escrita (D247, fleet).
  - name: MaintenanceOrders
    description: Ordens de Serviço — Aggregate Root, status só por comando (D252/D253, maintenance).
  - name: MaintenanceOrderItems
    description: Itens de OS — sub-recurso, custo realizado é derivado (D254, maintenance).
  - name: MaintenanceApprovals
    description: Aprovações de custo — recurso próprio, alçada só consultada (D255, maintenance).
  - name: MaintenancePreventivePlans
    description: Planos de manutenção preventiva — Reference Data, tipo_gatilho extensível (maintenance).
  - name: ServiceTypes
    description: Tipos de serviço — Reference Data, pré-requisito de Plano Preventivo (maintenance).
  - name: MaintenanceHistory
    description: Histórico operacional da OS — somente leitura, nunca Timeline Universal (D257, maintenance).
  - name: AccountsPayable
    description: Contas a Pagar — máquina de estados própria, baixa é comando (D264, financial).
  - name: Invoices
    description: Faturas — CRUD mínimo (D260), imutável após emitida (financial).
  - name: AccountsReceivable
    description: Contas a Receber — sub-recurso de Fatura, sem estado de cancelamento (D273, financial).
  - name: ChartOfAccounts
    description: Plano de Contas — hierarquia sem ciclo, RBAC corrigido nesta preparação (D271, financial).
  - name: BankAccounts
    description: Contas Bancárias — saldo sempre derivado (D263), RBAC corrigido nesta preparação (D271, financial).
  - name: CashPosition
    description: Posição de Caixa — Read Model puro, sem verbo de escrita (financial).
  - name: BankReconciliation
    description: Conciliação Bancária — extrato/lançamento/correspondência/conciliação (financial).
  - name: FinancialReversals
    description: Estorno Financeiro — mecanismo único de correção pós-fato (D266, financial).
  - name: FinancialTrip
    description: Financeiro da Viagem — leitura especializada, Viagem continua dona dos valores (D262, freight).
  - name: SubscriptionPlans
    description: Planos — Platform Reference Data, somente leitura (subscription, D272 — não é financial).
  - name: Subscriptions
    description: Assinatura — enum físico mais restrito que a máquina conceitual (D272-nota, subscription).
  - name: RecurringBilling
    description: Cobrança Recorrente — criação automática por ciclo, Asaas nunca exposto (D265, billing).
  - name: CTe
    description: CT-e — máquina de 8 estados, status só por comando (D274), sem POST manual (documents).
  - name: MDFe
    description: MDF-e — consolida CT-e autorizados, encerramento trava D019 (documents).
  - name: CIOT
    description: CIOT — motorista autônomo, protocolo ANTT distinto de SEFAZ (documents).
  - name: CorrectionLetters
    description: Carta de Correção — artefato anexado ao CT-e, nunca altera o documento pai (D282, documents).
  - name: ReferencedNFe
    description: NF-e Referenciada — referência fiscal, nunca uma NF-e emitida pela transportadora (documents).
  - name: FiscalEvents
    description: Eventos Fiscais — log técnico bruto, somente leitura (D277, documents).
  - name: FiscalConfiguration
    description: Configuração Fiscal do Tenant — certificado/série/ambiente, RBAC corrigido nesta preparação (D283, documents).
  - name: TrackingProviders
    description: Provedores de Rastreamento — cadastro agnóstico de fornecedor (D291, tracking).
  - name: TrackingDevices
    description: Equipamentos de Rastreamento — múltiplos por veículo, um PRINCIPAL vigente (D128, tracking).
  - name: VehiclePositions
    description: Posições — Time Series, somente leitura, cursor obrigatório (D285/D286/D287, tracking).
  - name: TelemetryReadings
    description: Telemetria — Time Series EAV, somente leitura (D120/D286, tracking).
  - name: Heartbeats
    description: Heartbeats — sinal técnico, nunca evento de negócio (tracking).
  - name: TrackingEvents
    description: Eventos de Rastreamento — derivados, referenciam a origem, autorização por categoria (D288/D294, tracking).
  - name: Geofences
    description: Geofences — configuração com CRUD completo, distinta do histórico de cruzamento (D289, tracking).
  - name: TrackingHistory
    description: Histórico de Rastreamento — Read Model composto, sem tabela própria (D290, tracking).
  - name: DriverAuthentication
    description: Autenticação do Motorista — tenant/RBAC nunca vêm do dispositivo (D295/D296, mobile).
  - name: DriverTrips
    description: Viagens do Motorista — mesma máquina de estados da Viagem, nenhum comando novo (D297/D303, freight).
  - name: DriverOccurrences
    description: Ocorrências do Motorista — mesma entidade de 017, D303 (freight).
  - name: DriverDeliveries
    description: Entregas do Motorista — mesmo Canhoto de 015, D303 (freight).
  - name: DriverSignatures
    description: Assinaturas Digitais — somente leitura, criação via comando de Entrega (mobile).
  - name: DriverSync
    description: Sincronização — fila por sequencia_local, conflito resolvido pelo backend (D298/D299/D300, mobile).
  - name: DriverDevices
    description: Dispositivos Mobile — autoatendimento do próprio Motorista (D304, mobile).
  - name: Metrics
    description: Métricas — versionadas, fórmula histórica nunca sobrescrita (D155, analytics).
  - name: ConsolidatedIndicators
    description: Indicadores Consolidados — só leitura, nunca aceita fórmula/valor no request (analytics).
  - name: AnalyticalSnapshots
    description: Snapshots Analíticos — imutáveis após CONSOLIDADO (D151, analytics).
  - name: AnalyticsCubes
    description: Cubos Analíticos — definição estrutural, nunca infraestrutura de execução (analytics).
  - name: Dashboards
    description: Dashboards — configuração/referência, nunca guarda valor de KPI (D152, reporting).
  - name: SavedFilters
    description: Filtros Favoritos — sempre pessoais, nunca globais (reporting).
  - name: SavedReports
    description: Relatórios Salvos — configuração, nunca query física (reporting).
  - name: Exports
    description: Exportações — assíncronas, arquivo sempre em Storage (D307/D308, reporting).
  - name: ScheduledUpdates
    description: Agendamentos de Atualização — nunca executam cálculo, só solicitam (D159, reporting).
  - name: AIModels
    description: Modelos de IA — fornecedor lógico, nunca o provedor real (D170/D309, ai).
  - name: AIInferences
    description: Inferências de IA — log técnico auditável, custo com autorização por campo (D172, ai).
  - name: AISuggestions
    description: Sugestões de IA — decisão nunca executa comando operacional diretamente (D310/D311, ai).
  - name: AIPredictions
    description: Predições de IA — validade temporal sempre explícita (D163/D312, ai).
  - name: AIClassifications
    description: Classificações e Anomalias de IA — nunca viram regra operacional automática (ai).
  - name: ComputerVision
    description: Visão Computacional — resultado é sempre proposta, nunca aplicado automaticamente (D161/D164, ai).
  - name: AIFeedback
    description: Feedback de IA — matéria-prima para evolução dos modelos (D165, ai).
  - name: Storage
    description: Mecanismo de upload/download — domínio-agnóstico de provedor físico (D314, storage).
  - name: Files
    description: Metadados de arquivo — distinto do mecanismo de Storage (D315, storage).
  - name: Attachments
    description: Anexos — infraestrutura polimórfica compartilhada, dono resolvido pelo path (D186/D316, storage).
  - name: Comments
    description: Comentários — mesma infraestrutura compartilhada de Attachments (D186/D316, storage).
  - name: GlobalSearch
    description: Busca global — respeita exatamente as mesmas autorizações das consultas originais (D317).
  - name: Timelines
    description: Linha do tempo universal — read model, nunca uma tabela própria (D318).
  - name: Notifications
    description: Notificações — efeito colateral de um evento de domínio, nunca sua origem (D320, notification_center).
  - name: Integrations
    description: Configuração de Integração — contrato único, nunca uma API por fornecedor (D321, integration).
  - name: Webhooks
    description: Webhooks — entrega idempotente e reprocessável (D111/D138, integration).
  - name: Jobs
    description: Execução de Job — autorizada individualmente, nunca disparo arbitrário (D322, integration).
  - name: Management Results
    description: Resultado Gerencial — Viagem/Veículo/Cliente/Motorista, projeção calculada sobre fatos existentes, sem entidade nova (D090/D149, analytics).

paths:
  # ---------------------------------------------------------------------------
  # Authentication — 001-authentication.md
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentication]
      summary: Autentica um usuário e inicia uma sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [email, password]
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  expires_in: { type: integer }
                  user: { $ref: "#/components/schemas/User" }
                required: [access_token, refresh_token, expires_in, user]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Renova o par de tokens a partir de um refresh token válido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: Novo par de tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  expires_in: { type: integer }
                required: [access_token, refresh_token, expires_in]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Encerra a sessão atual
      responses:
        "204": { description: Sessão encerrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Inicia o fluxo de redefinição de senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "200":
          description: >
            Sempre retornado, exista ou não o e-mail — nunca revela existência (ERROR_MODEL.md).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Conclui a redefinição de senha usando o token recebido por e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 8 }
              required: [token, new_password]
      responses:
        "200":
          description: Senha redefinida
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Retorna o usuário autenticado, o tenant e a sessão atual
      responses:
        "200":
          description: Identidade do ator autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tenant: { $ref: "#/components/schemas/TenantContext" }
                  session: { $ref: "#/components/schemas/Session" }
                  roles:
                    type: array
                    items: { type: string }
                    description: >-
                      Nomes dos Papéis do Usuário (não os códigos de permissão) — conveniência de
                      exibição. `user.roles` continua como UUIDs; resolver permission codes ainda
                      exige `GET /roles/{id}` por Papel (ver achado em `001-authentication.md`).
                required: [user, tenant, session, roles]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ---------------------------------------------------------------------------
  # Tenants — 002-tenants.md
  # ---------------------------------------------------------------------------
  /tenant:
    get:
      tags: [Tenants]
      summary: Obtém os dados do tenant autenticado
      responses:
        "200":
          description: Tenant do contexto autenticado (D208)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Tenants]
      summary: Atualiza os dados do tenant autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razao_social: { type: string }
                cnpj: { type: string }
      responses:
        "200":
          description: Tenant atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ---------------------------------------------------------------------------
  # Users — 003-users.md
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: Lista usuários do tenant
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/StatusFilterParam"
        - name: role
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
          description: Filtra por Papel atribuído (via usuarios_papeis, D222).
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/ExpandParam"
      responses:
        "200":
          description: Coleção paginada de usuários
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Users]
      summary: Cria um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                driver_id: { $ref: "#/components/schemas/UUID" }
                employee_id: { $ref: "#/components/schemas/UUID" }
                role_ids:
                  type: array
                  items: { $ref: "#/components/schemas/UUID" }
              required: [nome, email, password]
      responses:
        "201":
          description: Usuário criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtém um usuário
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Users]
      summary: Atualiza um usuário
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                role_ids:
                  type: array
                  items: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Users]
      summary: Desativa um usuário (soft delete, D219)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204": { description: Usuário desativado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ---------------------------------------------------------------------------
  # Roles — 004-roles.md
  # ---------------------------------------------------------------------------
  /roles:
    get:
      tags: [Roles]
      summary: Lista papéis do tenant
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Coleção paginada de papéis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Roles]
      summary: Cria um papel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                descricao: { type: string }
                permissions:
                  type: array
                  items: { type: string }
              required: [nome]
      responses:
        "201":
          description: Papel criado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Obtém um papel
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Papel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Roles]
      summary: Atualiza um papel
      parameters:
