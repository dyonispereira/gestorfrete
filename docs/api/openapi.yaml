      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                mime_type: { type: string }
                size_bytes: { type: integer }
                origin: { type: string, enum: [UPLOAD_DIRETO, IMPORTADO] }
                previous_file_id: { $ref: "#/components/schemas/UUID" }
              required: [name, mime_type, size_bytes, origin]
      responses:
        "201":
          description: Upload iniciado
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id: { $ref: "#/components/schemas/UUID" }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /storage/uploads/{id}/commands/complete:
