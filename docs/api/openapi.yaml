        - name: geometry_type
          in: query
          required: false
          schema: { type: string, enum: [CIRCULO, POLIGONO] }
        - name: client_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: branch_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - $ref: "#/components/parameters/StatusFilterParam"
      responses:
        "200":
          description: Coleção paginada de geofences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Geofence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Geofences]
      summary: Cria uma geofence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                geometry_type: { type: string, enum: [CIRCULO, POLIGONO] }
                center:
                  type: object
                  properties:
                    latitude: { type: number, format: double }
                    longitude: { type: number, format: double }
                radius_meters: { type: number }
                polygon:
                  type: array
                  items:
                    type: object
                    properties:
                      latitude: { type: number, format: double }
                      longitude: { type: number, format: double }
                client_id: { $ref: "#/components/schemas/UUID" }
                branch_id: { $ref: "#/components/schemas/UUID" }
              required: [name, geometry_type]
      responses:
        "201":
          description: Geofence criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Geofence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /tracking/geofences/{id}:
    get:
      tags: [Geofences]
      summary: Obtém uma geofence
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
