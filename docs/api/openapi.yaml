        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /ordens-servico/{id}/commands/retomar-execucao:
    post:
      tags: [MaintenanceOrders]
      summary: "AGUARDANDO_PECA → EM_EXECUCAO: peça recebida (compra concluída ou retirada do Almoxarifado)"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Ordem de serviço em execução
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /ordens-servico/{id}/commands/concluir:
    post:
      tags: [MaintenanceOrders]
      summary: "EM_EXECUCAO → CONCLUIDA: reparo finalizado e veículo testado"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                evidence_file_ids:
                  type: array
