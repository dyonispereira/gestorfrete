  # ---------------------------------------------------------------------------
  # Trips — 014-trips.md
  # ---------------------------------------------------------------------------
  /viagens:
    get:
      tags: [Trips]
      summary: Lista viagens do tenant
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status_operacional
          in: query
          required: false
          schema: { type: string }
        - name: status_fiscal
          in: query
          required: false
          schema: { type: string }
        - name: status_financeiro
          in: query
          required: false
          schema: { type: string }
        - name: motorista_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: veiculo_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: cliente_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: data_programada
          in: query
          required: false
          schema: { type: string, format: date }
        - name: codigo
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Coleção paginada de viagens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Trips]
      summary: Cria uma viagem (nasce em RASCUNHO)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cliente_id: { $ref: "#/components/schemas/UUID" }
                data_programada: { type: string, format: date }
                janela_programada: { type: string, format: date-time }
              required: [cliente_id]
      responses:
        "201":
          description: Viagem criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}:
    get:
      tags: [Trips]
      summary: Obtém uma viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Viagem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Trips]
      summary: Atualiza campos editáveis da viagem (nunca status, referências ou snapshots)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_programada: { type: string, format: date }
                janela_programada: { type: string, format: date-time }
      responses:
        "200":
          description: Viagem atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Trips]
      summary: Exclui uma viagem em RASCUNHO/PLANEJADA (soft delete, D219)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204": { description: Viagem excluída }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}/commands/accept:
    post:
      tags: [Trips]
      summary: "Motorista aceita a viagem atribuída (D129) — nunca muda o status"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Viagem (inalterada em status, evento MotoristaAceitouViagem publicado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}/commands/dispatch:
    post:
      tags: [Trips]
      summary: "Despacha a viagem (LIBERADA → EM_DESLOCAMENTO), acionado pelo Gestor"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Viagem despachada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}/commands/start:
    post:
      tags: [Trips]
