            application/json:
              schema: { $ref: "#/components/schemas/TripAllocation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [TripResources]
      summary: Cria a primeira alocação de recursos da viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id: { $ref: "#/components/schemas/UUID" }
                tractor_unit_id: { $ref: "#/components/schemas/UUID" }
                implement_id: { $ref: "#/components/schemas/UUID" }
              required: [driver_id, tractor_unit_id]
      responses:
        "201":
          description: Alocação criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripAllocation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}/commands/reallocate-resources:
    post:
      tags: [TripResources]
      summary: Troca a alocação de recursos vigente (D188) — pacote atômico, nunca por recurso isolado
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id: { $ref: "#/components/schemas/UUID" }
                tractor_unit_id: { $ref: "#/components/schemas/UUID" }
                implement_id: { $ref: "#/components/schemas/UUID" }
                reason: { type: string }
              required: [driver_id, tractor_unit_id, reason]
      responses:
        "200":
          description: Nova alocação vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripAllocation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ---------------------------------------------------------------------------
  # Trip Occurrences — 017-trip-occurrences.md
  # ---------------------------------------------------------------------------
  /viagens/{id}/occurrences:
    get:
      tags: [TripOccurrences]
      summary: Lista ocorrências da viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [ATRASO, AVARIA, PANE, SINISTRO, OUTRO] }
        - $ref: "#/components/parameters/StatusFilterParam"
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [BAIXA, MEDIA, ALTA, CRITICA] }
      responses:
        "200":
          description: Coleção paginada de ocorrências
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Occurrence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [TripOccurrences]
      summary: Registra uma ocorrência na viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
