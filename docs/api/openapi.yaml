  # ---------------------------------------------------------------------------
  # Maintenance Orders — 026-maintenance-orders.md
  # ---------------------------------------------------------------------------
  /ordens-servico:
    get:
      tags: [MaintenanceOrders]
      summary: Lista ordens de serviço do tenant
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: vehicle_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - $ref: "#/components/parameters/StatusFilterParam"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [PREVENTIVA, CORRETIVA, EMERGENCIAL, GARANTIA] }
        - name: origin
          in: query
          required: false
          schema: { type: string, enum: [MANUAL, MANUTENCAO_PREVENTIVA_SUGERIDA, VIAGEM_INTERROMPIDA, CHECKLIST_REPROVADO, SUGESTAO_IA] }
        - name: mechanic_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: supplier_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Coleção paginada de ordens de serviço
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MaintenanceOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [MaintenanceOrders]
      summary: Cria uma ordem de serviço (status inicial ABERTA, origin sempre MANUAL)
      responses:
        "201":
          description: Ordem de serviço criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id: { $ref: "#/components/schemas/UUID" }
                vehicle_composition_id: { $ref: "#/components/schemas/UUID" }
                supplier_id: { $ref: "#/components/schemas/UUID" }
                type: { type: string, enum: [PREVENTIVA, CORRETIVA, EMERGENCIAL, GARANTIA] }
                problem_description: { type: string }
                cause: { type: string, enum: [DESGASTE, QUEBRA, ACIDENTE, MAU_USO, INSPECAO, RECALL] }
              required: [vehicle_id, type, problem_description]

  /ordens-servico/{id}:
    get:
      tags: [MaintenanceOrders]
      summary: Obtém uma ordem de serviço
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Ordem de serviço
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [MaintenanceOrders]
      summary: Atualiza campos da ordem de serviço (nunca status, D253)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplier_id: { $ref: "#/components/schemas/UUID" }
                problem_description: { type: string }
                cause: { type: string, enum: [DESGASTE, QUEBRA, ACIDENTE, MAU_USO, INSPECAO, RECALL] }
                root_cause: { type: string }
                technical_diagnosis: { type: string }
                mechanic_id: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Ordem de serviço atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [MaintenanceOrders]
      summary: Exclui uma ordem de serviço (soft delete, D219 — só em status ABERTA)
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204": { description: Ordem de serviço excluída }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /ordens-servico/{id}/commands/iniciar-diagnostico:
    post:
      tags: [MaintenanceOrders]
      summary: "ABERTA → EM_DIAGNOSTICO: mecânico inicia a avaliação do problema"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Ordem de serviço em diagnóstico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /ordens-servico/{id}/commands/concluir-diagnostico:
    post:
      tags: [MaintenanceOrders]
      summary: "EM_DIAGNOSTICO → AGUARDANDO_PECA | EM_EXECUCAO (branch derivado por disponibilidade de peça)"
