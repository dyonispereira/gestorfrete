          schema: { type: string, enum: [PARADA_DETECTADA, DESVIO_DE_ROTA_DETECTADO, EXCESSO_DE_VELOCIDADE, ENTROU_GEOFENCE, SAIU_GEOFENCE, IGNICAO_LIGADA, IGNICAO_DESLIGADA] }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [INFORMACAO, ATENCAO, ALERTA, CRITICO] }
        - name: vehicle_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: occurred_at__gte
          in: query
