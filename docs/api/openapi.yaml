  # ---------------------------------------------------------------------------
  # Trip Deliveries — 015-trip-deliveries.md
  # ---------------------------------------------------------------------------
  /viagens/{id}/entregas:
    get:
      tags: [TripDeliveries]
      summary: Lista entregas da viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Coleção paginada de entregas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [TripDeliveries]
      summary: Cria uma entrega para a viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: integer, minimum: 1 }
                recipient: { type: string }
                delivery_address: { type: object }
                window:
                  type: object
                  properties:
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                  required: [starts_at, ends_at]
              required: [order, recipient, delivery_address]
      responses:
        "201":
          description: Entrega criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}/entregas/{entregaId}:
    get:
      tags: [TripDeliveries]
      summary: Obtém uma entrega da viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
        - name: entregaId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Entrega
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [TripDeliveries]
      summary: Atualiza uma entrega da viagem
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
        - name: entregaId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [PENDENTE, CONCLUIDA, RECUSADA, DEVOLVIDA, CANCELADA] }
                rejection_reason: { type: string }
      responses:
        "200":
          description: Entrega atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /viagens/{id}/entregas/{entregaId}/canhoto:
    post:
      tags: [TripDeliveries]
      summary: Registra o canhoto (comprovante de entrega) de uma entrega
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
        - name: entregaId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signature_file_id: { $ref: "#/components/schemas/UUID" }
      responses:
        "201":
          description: Canhoto registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofOfDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

