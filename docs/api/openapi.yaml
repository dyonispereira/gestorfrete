        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      tags: [Webhooks]
      summary: "Atualiza um webhook (D229 — parcial)"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_url: { type: string, format: uri }
                subscribed_events: { type: array, items: { type: string } }
      responses:
        "200":
          description: Webhook atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /integrations/webhooks/{id}/commands/activate:
    post:
      tags: [Webhooks]
      summary: "Ativa o webhook (INATIVO/SUSPENSO → ATIVO)"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Webhook ativado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /integrations/webhooks/{id}/commands/suspend:
    post:
      tags: [Webhooks]
      summary: "Suspende o webhook manualmente (→ SUSPENSO)"
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Webhook suspenso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /integrations/webhooks/{id}/commands/test:
    post:
      tags: [Webhooks]
      summary: Envia um payload de teste ao endpoint de destino
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Resultado da tentativa de teste
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean }
                  http_status: { type: integer }
                  duration_ms: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ---------------------------------------------------------------------------
  # Jobs — 089-jobs.md
  # ---------------------------------------------------------------------------
  /jobs:
    get:
      tags: [Jobs]
      summary: "Lista execuções de job (log técnico, cursor-paginado)"
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/LimitParam"
        - name: job_type
          in: query
          required: false
          schema: { type: string }
        - name: result
          in: query
          required: false
          schema: { type: string, enum: [SUCESSO, FALHA] }
        - name: started_at__gte
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: started_at__lte
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Coleção cursor-paginada de execuções de job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/JobExecution" }
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          next_cursor: { type: string }
                          has_more: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Obtém uma execução de job
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Execução de job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /jobs/commands/trigger:
    post:
      tags: [Jobs]
      summary: "Dispara um job registrado (D322 — nunca um comando arbitrário)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_type: { type: string }
                parameters: { type: object }
              required: [job_type]
      responses:
        "202":
          description: Execução de job solicitada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    StatusFilterParam:
      name: status
      in: query
      required: false
      schema: { type: string }
    SearchParam:
      name: search
      in: query
      required: false
      schema: { type: string }
    SortParam:
      name: sort
      in: query
      required: false
      schema: { type: string }
    ExpandParam:
      name: expand
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
      explode: false
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Payload sintaticamente inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Autenticado, mas sem a permissão/escopo necessário (D212)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não existe (ou existe em outro tenant)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito de estado (UNIQUE, Idempotency-Key com payload diferente)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Payload válido, mas viola uma regra de negócio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit excedido
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalServerError:
      description: Erro interno — nunca expõe stack trace
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    UUID:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    Money:
      type: object
      properties:
        amount: { type: string }
        currency: { type: string, enum: ["BRL"], default: "BRL" }
      required: [amount, currency]

    AddressFields:
      type: object
      description: >-
        Só campos de texto sem identidade própria (usado em snapshot embutido, nunca como recurso
        editável). Para o recurso Endereço completo, ver o schema `Address` (D231).
      properties:
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, minLength: 2, maxLength: 2 }
        cep: { type: string }
      required: [logradouro, bairro, cidade, uf, cep]

    PageMeta:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
      required: [page, limit, total_items, total_pages]

    Pagination:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            pagination: { $ref: "#/components/schemas/PageMeta" }
          required: [pagination]
      required: [data, meta]

    ValidationErrorDetail:
      type: object
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
      required: [field, code, message]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { $ref: "#/components/schemas/ValidationErrorDetail" }
            request_id: { type: string, format: uuid }
            correlation_id: { type: string, format: uuid }
          required: [code, message, details, request_id]
      required: [error]

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"

    AuditMetadata:
      type: object
      properties:
        created_at: { $ref: "#/components/schemas/Timestamp" }
        created_by: { $ref: "#/components/schemas/UUID" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { $ref: "#/components/schemas/UUID" }
      required: [created_at, updated_at]

    TenantContext:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        razao_social: { type: string }
        status: { type: string, enum: [TRIAL, ATIVO, SUSPENSO, CANCELADO] }
      required: [id, codigo, razao_social, status]

    User:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [ATIVO, INATIVO, BLOQUEADO] }
        driver_id: { $ref: "#/components/schemas/UUID" }
        employee_id: { $ref: "#/components/schemas/UUID" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, nome, email, status, audit]

    Role:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        nome: { type: string }
        descricao: { type: string }
        permissions:
          type: array
          items: { type: string }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, nome, permissions, audit]

    Permission:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        code: { type: string }
        name: { type: string }
        module: { type: string }
      required: [id, code, name, module]

    Branch:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        nome: { type: string }
        is_headquarters: { type: boolean }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, nome, is_headquarters, audit]

    Client:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        razao_social: { type: string }
        nome_fantasia: { type: string }
        document: { type: string }
        telefone: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [ATIVO, INATIVO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, razao_social, document, status, audit]

    Supplier:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        razao_social: { type: string }
        cnpj: { type: string }
        telefone: { type: string }
        category:
          type: string
          enum: [PECA, RECAPAGEM, SEGURO, OFICINA, POSTO, BORRACHARIA, GUINCHO, OUTRO]
        status: { type: string, enum: [ATIVO, INATIVO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, razao_social, cnpj, status, audit]

    Driver:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        nome: { type: string }
        cpf: { type: string }
        telefone: { type: string }
        email: { type: string, format: email }
        employment_type: { type: string, enum: [EMPREGADO, AUTONOMO] }
        fitness_status: { type: string, enum: [APTO, BLOQUEADO], readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, nome, cpf, employment_type, fitness_status, audit]

    DriverDocument:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type: { type: string, enum: [CNH, RG, EXAME_TOXICOLOGICO, REGISTRO_ANTT] }
        number: { type: string }
        cnh_category: { type: string, enum: [A, B, C, D, E] }
        expires_at: { type: string, format: date }
        status: { type: string, enum: [VALIDO, VENCIDO], readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, type, number, status, audit]

    Employee:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        nome: { type: string }
        cargo: { type: string }
        hired_at: { type: string, format: date }
        status: { type: string, enum: [ATIVO, INATIVO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, nome, cargo, status, audit]

    Address:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type: { type: string, enum: [PRINCIPAL, COBRANCA, ENTREGA, OUTRO] }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, minLength: 2, maxLength: 2 }
        cep: { type: string }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, type, logradouro, bairro, cidade, uf, cep, audit]

    Contact:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        nome: { type: string }
        cargo: { type: string }
        telefone: { type: string }
        email: { type: string, format: email }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
      required: [id, nome, created_at, updated_at]

    CostCenter:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        accounting_code: { type: string }
        nome: { type: string }
        branch_id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [ATIVO, INATIVO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, accounting_code, nome, status, audit]

    TripStatus:
      type: object
      properties:
        operational:
          type: string
          enum: [RASCUNHO, PLANEJADA, AGUARDANDO_CHECKLIST, LIBERADA, EM_DESLOCAMENTO, CARREGANDO, EM_TRANSITO, EM_ENTREGA, FINALIZADA, INTERROMPIDA, CANCELADA]
          readOnly: true
        fiscal:
          type: string
          enum: [PENDENTE, CTE_EMITIDO, MDFE_EMITIDO, MDFE_ENCERRADO, CTE_CANCELADO]
          readOnly: true
        financial:
          type: string
          enum: [AGUARDANDO_FATURAMENTO, FATURADA, AGUARDANDO_RECEBIMENTO, RECEBIDA]
          readOnly: true
        closed: { type: boolean, readOnly: true }
      required: [operational, fiscal, financial, closed]

    TripReferences:
      type: object
      properties:
        client_id: { $ref: "#/components/schemas/UUID" }
        driver_id: { $ref: "#/components/schemas/UUID" }
        tractor_unit_id: { $ref: "#/components/schemas/UUID" }
      required: [client_id]

    TripSnapshots:
      type: object
      properties:
        driver_name_snapshot: { type: string, readOnly: true }
        tractor_unit_plate_snapshot: { type: string, readOnly: true }
        client_snapshot: { type: object, readOnly: true }
        predicted_revenue_snapshot: { type: string, readOnly: true }
        applied_price_table_id: { $ref: "#/components/schemas/UUID" }

    TripFinancials:
      type: object
      properties:
        predicted_cost: { type: string, readOnly: true }
        actual_cost: { type: string, readOnly: true }
        actual_revenue: { type: string, readOnly: true }
        predicted_margin: { type: string, readOnly: true }
        actual_margin: { type: string, readOnly: true }
        financial_deviation: { type: string, readOnly: true }

    Trip:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string, example: "VG-2026-000123" }
        scheduled_date: { type: string, format: date }
        scheduled_window: { type: string, format: date-time }
        references: { $ref: "#/components/schemas/TripReferences" }
        snapshots: { $ref: "#/components/schemas/TripSnapshots" }
        status: { $ref: "#/components/schemas/TripStatus" }
        financials: { $ref: "#/components/schemas/TripFinancials" }
        distance_traveled_km: { type: string, readOnly: true }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, references, status, audit]

    TripAllocation:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        driver_id: { $ref: "#/components/schemas/UUID" }
        tractor_unit_id: { $ref: "#/components/schemas/UUID" }
        implement_id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [VIGENTE, SUBSTITUIDA], readOnly: true }
        replacement_reason: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
      required: [id, driver_id, tractor_unit_id, status, created_at]

    Delivery:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        order: { type: integer, minimum: 1 }
        recipient: { type: string }
        delivery_address: { type: object }
        status: { type: string, enum: [PENDENTE, CONCLUIDA, RECUSADA, DEVOLVIDA, CANCELADA] }
        completed_at: { type: string, format: date-time, readOnly: true }
        rejection_reason: { type: string }
        window:
          type: object
          properties:
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, order, recipient, delivery_address, status, audit]

    ProofOfDelivery:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [PENDENTE, REGISTRADO] }
        registered_at: { type: string, format: date-time, readOnly: true }
        signature_file_id: { $ref: "#/components/schemas/UUID" }
      required: [id, status]

    Occurrence:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type: { type: string, enum: [ATRASO, AVARIA, PANE, SINISTRO, OUTRO] }
        description: { type: string }
        severity: { type: string, enum: [BAIXA, MEDIA, ALTA, CRITICA] }
        status: { type: string, enum: [ABERTA, RESOLVIDA] }
        occurred_at: { type: string, format: date-time }
        location:
          type: object
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
      required: [id, type, description, status, occurred_at]

    TripTimelineEntry:
      type: object
      properties:
        occurred_at: { type: string, format: date-time }
        source:
          type: string
          enum: [STATUS_OPERACIONAL, STATUS_FISCAL, STATUS_FINANCEIRO, STATUS_COMPOSTO, OCORRENCIA, COMENTARIO, ANEXO, CHECKLIST, ABASTECIMENTO, ORDEM_SERVICO, DOCUMENTO_FISCAL]
        summary: { type: string }
        reference_id: { $ref: "#/components/schemas/UUID" }
      required: [occurred_at, source, summary, reference_id]

    # -------------------------------------------------------------------------
    # Fleet — components/fleet-schemas.md (Lote 5)
    # -------------------------------------------------------------------------
    VehicleIdentity:
      type: object
      properties:
        codigo: { type: string, example: "VEI-000045" }
        plate: { type: string, description: "`placa` — Atributo Crítico (D077), trocar é evento raro e auditado." }
        renavam: { type: string }
      required: [codigo, plate, renavam]

    VehicleTechnicalSheet:
      type: object
      description: "Sub-recurso próprio (fleet.vehicle_technical_sheet.view/.edit, RBAC dedicado) — GET/PATCH /veiculos/{id}/technical-sheet, nunca embutido diretamente no PATCH de Veículo."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        manufacturer: { type: string, description: "`fabricante` (vive em veiculos_tracionadores, exposto aqui por coesão de leitura)." }
        model: { type: string, description: "`modelo`." }
        manufacture_year: { type: integer, description: "`ano_fabricacao`." }
        category_id: { $ref: "#/components/schemas/UUID", description: "`categoria_veiculo_id`." }
        chassis: { type: string, description: "`chassi` — único na plataforma." }
        engine: { type: string, description: "`motor`." }
        axles: { type: integer, description: "`eixos`." }
        tare_weight: { type: string, description: "`tara`." }
        load_capacity: { type: string, description: "`capacidade_carga`." }
        gross_vehicle_weight: { type: string, description: "`pbt`." }
        owner_rntrc: { type: string, description: "`rntrc_proprietario`." }
        fuel_type: { type: string, enum: [DIESEL_S10, DIESEL_S500, GNV, ELETRICO], description: "`combustivel`." }
      required: [id, manufacturer, model, manufacture_year, category_id, chassis, axles, tare_weight, load_capacity, gross_vehicle_weight, fuel_type]

    VehicleOperational:
      type: object
      description: "Nunca escrito diretamente — reflete disponibilidade_veiculo (Read Model, D081, 025-vehicle-availability.md). Todo campo é readOnly."
      properties:
        status: { type: string, enum: [DISPONIVEL, EM_VIAGEM, EM_MANUTENCAO, INATIVO], readOnly: true }
        current_driver_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        current_implement_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        updated_at: { $ref: "#/components/schemas/Timestamp", readOnly: true }

    Vehicle:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        identity: { $ref: "#/components/schemas/VehicleIdentity" }
        status: { type: string, enum: [ATIVO, INATIVO], description: "`veiculos_tracionadores.status` — status de cadastro, distinto de `operational.status` (disponibilidade operacional)." }
        branch_id: { $ref: "#/components/schemas/UUID", description: "`filial_id`." }
        operational: { $ref: "#/components/schemas/VehicleOperational" }
        tracking_reference:
          type: object
          readOnly: true
          description: "D250 — só referência/ponteiro para consulta em tracking (posição atual, último sinal), nunca dado GPS embutido aqui. Fica nulo neste lote enquanto a API de Rastreamento não existir."
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, identity, status, operational, audit]

    Implement:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string, example: "IMP-000012" }
        plate: { type: string, description: "`placa`." }
        renavam: { type: string }
        body_type: { type: string, enum: [CARRETA, TANQUE, BAU, GRANELEIRO, PRANCHA, FRIGORIFICO, GAIOLA], description: "`tipo_carroceria`." }
        category_id: { $ref: "#/components/schemas/UUID", description: "`categoria_veiculo_id`." }
        load_capacity: { type: string, description: "`capacidade_carga`." }
        availability_status: { type: string, enum: [DISPONIVEL, EM_USO, INATIVO], description: "`status_disponibilidade`." }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, plate, renavam, body_type, category_id, load_capacity, availability_status, audit]

    VehicleComposition:
      type: object
      description: "D248/D249 — pacote físico com vigência, nunca editado in-place. `implements` é uma lista ordenada (suporta bitrem/rodotrem, N:N com Implemento)."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        tractor_unit_id: { $ref: "#/components/schemas/UUID" }
        combination_type: { type: string, enum: [SIMPLES, BITREM, RODOTREM], description: "`tipo_combinacao`." }
        total_axles: { type: integer, description: "`eixos_total`." }
        status: { type: string, enum: [VALIDA, INVALIDA], readOnly: true }
        implements:
          type: array
          items:
            type: object
            properties:
              implement_id: { $ref: "#/components/schemas/UUID" }
              order: { type: integer, minimum: 1, description: "`ordem`." }
            required: [implement_id, order]
        starts_at: { type: string, format: date-time, readOnly: true, description: "`data_inicio_vigencia`." }
        ends_at: { type: string, format: date-time, readOnly: true, description: "`data_fim_vigencia` — nulo = vigente." }
      required: [id, tractor_unit_id, combination_type, total_axles, status, implements, starts_at]

    OdometerReading:
      type: object
      description: "D191/D246 — imutável, nunca editável/excluível."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        value_km: { type: string, description: "`valor_km`." }
        origin: { type: string, enum: [ABASTECIMENTO, CHECKLIST, MANUAL, TELEMETRIA], description: "`origem`." }
        trip_id: { $ref: "#/components/schemas/UUID", description: "`viagem_id`." }
        captured_at: { type: string, format: date-time, description: "`data_hora`." }
      required: [id, value_km, origin, captured_at]

    VehicleAvailability:
      type: object
      description: "D247 — Read Model puro, todo campo readOnly, nunca escrito via API."
      properties:
        vehicle_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        status: { type: string, enum: [DISPONIVEL, EM_VIAGEM, EM_MANUTENCAO, INATIVO], readOnly: true }
        current_driver_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        current_implement_id: { $ref: "#/components/schemas/UUID", readOnly: true }
        updated_at: { $ref: "#/components/schemas/Timestamp", readOnly: true }
      required: [vehicle_id, status, updated_at]

    VehicleDocument:
      type: object
      description: "D251 — `file_id` é sempre uma referência ao Storage, nunca o binário."
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type: { type: string, description: "`tipo` — vocabulário extensível (D120-style), ex.: CRLV." }
        number: { type: string, description: "`numero`." }
        expires_at: { type: string, format: date, description: "`data_validade`." }
        status: { type: string, enum: [VALIDO, VENCIDO], readOnly: true }
        file_id: { $ref: "#/components/schemas/UUID", description: "`arquivo_id`." }
      required: [id, type, number, expires_at, status]

    # -------------------------------------------------------------------------
    # Maintenance — components/maintenance-schemas.md (Lote 6)
    # -------------------------------------------------------------------------
    MaintenanceOrder:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string, example: "OS-2026-000045" }
        vehicle_id: { $ref: "#/components/schemas/UUID", description: "`veiculo_tracionador_id` — FK, imutável." }
        vehicle_composition_id: { $ref: "#/components/schemas/UUID", description: "`composicao_veicular_id` — quando aplicável." }
        supplier_id: { $ref: "#/components/schemas/UUID", description: "`fornecedor_executor_id` — Fornecedor Executor, referencia /suppliers (Lote 3)." }
        type: { type: string, enum: [PREVENTIVA, CORRETIVA, EMERGENCIAL, GARANTIA], description: "`tipo` — atributo independente do status." }
        origin: { type: string, enum: [MANUAL, MANUTENCAO_PREVENTIVA_SUGERIDA, VIAGEM_INTERROMPIDA, CHECKLIST_REPROVADO, SUGESTAO_IA], readOnly: true, description: "`origem_abertura` — D256, nunca substitui status." }
        problem_description: { type: string, description: "`descricao_problema`." }
        cause: { type: string, enum: [DESGASTE, QUEBRA, ACIDENTE, MAU_USO, INSPECAO, RECALL], description: "`causa` — só quando type = CORRETIVA." }
        root_cause: { type: string, description: "`causa_raiz`." }
        technical_diagnosis: { type: string, description: "`diagnostico_tecnico`." }
        mechanic_id: { $ref: "#/components/schemas/UUID", description: "`mecanico_id`." }
        predicted_cost: { type: string, readOnly: true, description: "`custo_previsto` — D254, nunca digitável." }
        actual_cost: { type: string, readOnly: true, description: "`custo_realizado` — D254, congela em FECHADA." }
        requires_approval: { type: boolean, readOnly: true, description: "`necessita_aprovacao` — calculado contra a alçada de settings (D255)." }
        completion_evidence_required: { type: boolean, readOnly: true, description: "`evidencia_conclusao_exigida` — D088." }
        status: { type: string, enum: [ABERTA, EM_DIAGNOSTICO, AGUARDANDO_APROVACAO, AGUARDANDO_PECA, EM_EXECUCAO, CONCLUIDA, FECHADA, CANCELADA], readOnly: true, description: "D253 — nunca alterado por PATCH." }
        execution_started_at: { type: string, format: date-time, readOnly: true, description: "`data_inicio_execucao`." }
        completed_at: { type: string, format: date-time, readOnly: true, description: "`data_conclusao`." }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, codigo, vehicle_id, type, origin, problem_description, status, audit]

    MaintenanceOrderItem:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        cost_category: { type: string, enum: [PECAS, PNEUS, SERVICOS, TERCEIROS, MAO_DE_OBRA_INTERNA, MAO_DE_OBRA_TERCEIRIZADA, DESLOCAMENTO, OUTROS], description: "`categoria_custo`." }
        description: { type: string, description: "`descricao`." }
        stock_part_id: { $ref: "#/components/schemas/UUID", description: "`peca_estoque_id` — só quando cost_category = PECAS." }
        quantity: { type: string, description: "`quantidade`." }
        unit_value: { type: string, description: "`valor_unitario`." }
        total_value: { type: string, readOnly: true, description: "`valor_total` — GENERATED, nunca digitável." }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, cost_category, description, quantity, unit_value, total_value, audit]

    MaintenanceApproval:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        level: { type: integer, description: "`nivel` — hoje sempre 1." }
        decision: { type: string, enum: [APROVADO, REJEITADO], readOnly: true, description: "`decisao` — só via commands/approve ou commands/reject." }
        justification: { type: string, description: "`justificativa` — obrigatória quando decision = REJEITADO." }
        actor_id: { $ref: "#/components/schemas/UUID", readOnly: true, description: "`ator_id`." }
        decided_at: { type: string, format: date-time, readOnly: true, description: "`data_hora`." }
      required: [id, level, decision, actor_id, decided_at]

    MaintenancePreventivePlan:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        vehicle_id: { $ref: "#/components/schemas/UUID", description: "`veiculo_tracionador_id` — um dos dois (vehicle_id/vehicle_category_id) é obrigatório." }
        vehicle_category_id: { $ref: "#/components/schemas/UUID", description: "`categoria_veiculo_id`." }
        trigger_type: { type: string, enum: [QUILOMETRAGEM, HORAS_MOTOR, DIAS, CALENDARIO, MOTOR, TELEMETRIA, RECOMENDACAO_FABRICANTE], description: "`tipo_gatilho`." }
        interval_value: { type: string, description: "`valor_intervalo`." }
        service_type_id: { $ref: "#/components/schemas/UUID", description: "`tipo_servico_id`." }
        status: { type: string, enum: [ATIVO, INATIVO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, trigger_type, interval_value, service_type_id, status, audit]

    ServiceType:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, description: "`nome` — único por tenant." }
        status: { type: string, enum: [ATIVO, INATIVO] }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, name, status, audit]

    MaintenanceOrderStatusHistoryEntry:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [ABERTA, EM_DIAGNOSTICO, AGUARDANDO_APROVACAO, AGUARDANDO_PECA, EM_EXECUCAO, CONCLUIDA, FECHADA, CANCELADA] }
        user_id: { $ref: "#/components/schemas/UUID", description: "`usuario_id` — nulo quando a transição é automática." }
        origin: { type: string, description: "`origem`." }
        notes: { type: string, description: "`observacao`." }
        occurred_at: { type: string, format: date-time, description: "`data_hora`." }
      required: [id, status, origin, occurred_at]

    # -------------------------------------------------------------------------
    # Financial — components/financial-schemas.md (Lote 7)
    # -------------------------------------------------------------------------
    Invoice:
      type: object
      description: >
        Lote Financeiro, Parte 3 — Faturamento Agrupado. `trips` substitui o antigo `trip_id`
        singular: uma Fatura cobre N Viagens elegíveis do mesmo cliente via `fatura_viagens`
        (nunca um array/JSON improvisado). Fatura por Entrega continua existindo à parte
        (`delivery_id` preenchido, `trips` vazio) — os dois modos são mutuamente exclusivos.
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        invoice_number: { type: string, description: "`numero_fatura`." }
        delivery_id: { $ref: "#/components/schemas/UUID", description: "`entrega_id` — modo \"por entrega\", mutuamente exclusivo com `trips`." }
        client_id: { $ref: "#/components/schemas/UUID", description: "`cliente_id`." }
        gross_value: { type: string, description: "`valor_bruto` — soma dos valores faturáveis dos itens (`trips[].value`)." }
        adjustment_value: { type: string, description: "`valor_ajuste` — explícito e auditável; exige `adjustment_reason` quando != 0." }
        adjustment_reason: { type: string, nullable: true, description: "`motivo_ajuste`." }
        total_value: { type: string, description: "`valor_total = gross_value + adjustment_value` — D100, calculado, imutável após emitida." }
        issue_date: { type: string, format: date, description: "`data_emissao`." }
        payment_method_id: { $ref: "#/components/schemas/UUID", description: "`forma_pagamento_id`." }
        status: { type: string, enum: [EMITIDA, CANCELADA], readOnly: true }
        trips:
          type: array
          description: "Itens da Fatura (`fatura_viagens`) — vazio no modo \"por entrega\"."
          items: { $ref: "#/components/schemas/InvoiceTrip" }
        audit: { $ref: "#/components/schemas/AuditMetadata" }
      required: [id, invoice_number, client_id, gross_value, adjustment_value, total_value, issue_date, payment_method_id, status, trips, audit]

    InvoiceTrip:
      type: object
      description: >
        Item de Fatura (`fatura_viagens`) — associação auditável Fatura↔Viagem. Só guarda
        `trip_id`+`value`; Entrega/CT-e são acessíveis apenas por navegação a partir da Viagem
        (D008 — financial não vira proprietária de fato fiscal).
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        trip_id: { $ref: "#/components/schemas/UUID", description: "`viagem_id`." }
        value: { type: string, description: "`valor` — capturado na criação da Fatura, > 0, imutável." }
      required: [id, trip_id, value]

    EligibleTrip:
      type: object
      description: "Item de `GET /faturas/viagens-elegiveis` — Viagem candidata a compor uma Fatura."
      properties:
        trip_id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string, description: "Código legível da Viagem (não o UUID)." }
        scheduled_date: { type: string, format: date, nullable: true }
        suggested_value: { type: string, nullable: true, description: "Sugestão de valor (receita prevista da Viagem) — apenas um default editável no wizard, nunca aplicado silenciosamente." }
      required: [trip_id, codigo]

    ResultTotals:
      type: object
      description: "Lote 4 — Resultado Gerencial. Compartilhado pelas 4 dimensões (090-management-results.md)."
      properties:
        trips: { type: integer }
        predicted_revenue: { type: string }
        realized_revenue: { type: string }
        predicted_cost: { type: string }
        realized_cost: { type: string }
        realized_margin: { type: string }
        predicted_margin: { type: string }
        realized_margin_pct: { type: string, nullable: true, description: "`null` quando `realized_revenue` é zero." }
        km: { type: string, nullable: true, description: "`null` — gap registrado, nunca aproximado (docs/domain/012-resultado-gerencial.md)." }
        revenue_per_km: { type: string, nullable: true }
        cost_per_km: { type: string, nullable: true }
        margin_per_km: { type: string, nullable: true }
      required: [trips, predicted_revenue, realized_revenue, predicted_cost, realized_cost, realized_margin, predicted_margin]

    OverviewResult:
      type: object
      properties:
        totals: { $ref: "#/components/schemas/ResultTotals" }
        maintenance_cost_realized: { type: string }
        other_costs_realized:
          type: string
          description: "Soma única — nunca a soma agrupada por Veículo + por Motorista (podem compartilhar a mesma Conta a Pagar)."
      required: [totals, maintenance_cost_realized, other_costs_realized]

    TripResult:
      type: object
      properties:
        trip_id: { $ref: "#/components/schemas/UUID" }
        codigo: { type: string }
        scheduled_date: { type: string, format: date, nullable: true }
        client_id: { $ref: "#/components/schemas/UUID" }
        client_name: { type: string, nullable: true }
        driver_id: { $ref: "#/components/schemas/UUID", nullable: true }
        driver_name: { type: string, nullable: true }
        vehicle_id: { $ref: "#/components/schemas/UUID", nullable: true }
        vehicle_plate: { type: string, nullable: true }
        totals: { $ref: "#/components/schemas/ResultTotals" }
      required: [trip_id, codigo, client_id, totals]

    VehicleResult:
      type: object
      properties:
        vehicle_id: { $ref: "#/components/schemas/UUID" }
        plate: { type: string }
        model: { type: string }
        trip_cost_realized: { type: string, description: "Só `viagens.custo_realizado` do Veículo." }
        maintenance_cost_predicted: { type: string }
        maintenance_cost_realized: { type: string }
        other_costs_realized: { type: string }
        operational_result: { type: string, description: "Resultado Operacional de Viagens — sem Manutenção/Outros Custos." }
        operational_margin_pct: { type: string, nullable: true }
        totals:
          allOf:
            - $ref: "#/components/schemas/ResultTotals"
          description: "`realized_cost`/`realized_margin` aqui são o Resultado TOTAL do Veículo — inclui Manutenção + Outros Custos."
      required: [vehicle_id, plate, model, trip_cost_realized, maintenance_cost_predicted, maintenance_cost_realized, other_costs_realized, operational_result, totals]

    VehicleCostOrigin:
      type: object
      description: "Item de drill-down — a Conta a Pagar exata (e a Ordem de Serviço, quando `origin=ORDEM_SERVICO`) por trás de um real de Manutenção/Outros Custos."
      properties:
        accounts_payable_id: { $ref: "#/components/schemas/UUID" }
        origin: { type: string, enum: [ORDEM_SERVICO, ABASTECIMENTO, COMPRA, AJUSTE_MANUAL] }
        maintenance_order_id: { $ref: "#/components/schemas/UUID", nullable: true }
        value: { type: string }
        accounting_period: { type: string, format: date }
        status: { type: string, enum: [LANCADA, AGUARDANDO_APROVACAO, APROVADA, PAGA, CONCILIADA] }
      required: [accounts_payable_id, origin, value, accounting_period, status]

    VehicleResultDetail:
      type: object
      properties:
        result: { $ref: "#/components/schemas/VehicleResult" }
        trips:
          type: array
          items: { $ref: "#/components/schemas/TripResult" }
        cost_origins:
          type: array
          items: { $ref: "#/components/schemas/VehicleCostOrigin" }
      required: [result, trips, cost_origins]

    ClientResult:
      type: object
      properties:
        client_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        trade_name: { type: string, nullable: true }
        totals:
          allOf:
            - $ref: "#/components/schemas/ResultTotals"
          description: "`realized_cost` é só o custo operacional de Viagem do Cliente — nunca inclui Manutenção/frota (gap registrado)."
      required: [client_id, name, totals]

    ClientInvoiceSummary:
      type: object
      properties:
        invoice_id: { $ref: "#/components/schemas/UUID" }
        invoice_number: { type: string }
        issue_date: { type: string, format: date }
        status: { type: string, enum: [EMITIDA, CANCELADA] }
        total_value: { type: string }
        trip_count: { type: integer }
      required: [invoice_id, invoice_number, issue_date, status, total_value, trip_count]

    ClientResultDetail:
      type: object
      properties:
        result: { $ref: "#/components/schemas/ClientResult" }
        trips:
          type: array
          items: { $ref: "#/components/schemas/TripResult" }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/ClientInvoiceSummary" }
      required: [result, trips, invoices]

    DriverResult:
      type: object
      properties:
        driver_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        trip_cost_realized: { type: string, description: "Custo das Viagens que o Motorista executou." }
        linked_cost_realized:
          type: string
          description: "Contas a Pagar explicitamente vinculadas ao Motorista (`origem != VIAGEM`) — nunca herdado do Veículo."
        totals: { $ref: "#/components/schemas/ResultTotals" }
      required: [driver_id, name, trip_cost_realized, linked_cost_realized, totals]

    DriverLinkedCost:
      type: object
      properties:
        accounts_payable_id: { $ref: "#/components/schemas/UUID" }
        origin: { type: string, enum: [ABASTECIMENTO, COMPRA, AJUSTE_MANUAL] }
        value: { type: string }
        accounting_period: { type: string, format: date }
        status: { type: string, enum: [LANCADA, AGUARDANDO_APROVACAO, APROVADA, PAGA, CONCILIADA] }
      required: [accounts_payable_id, origin, value, accounting_period, status]

    DriverResultDetail:
      type: object
      properties:
        result: { $ref: "#/components/schemas/DriverResult" }
        trips:
          type: array
          items: { $ref: "#/components/schemas/TripResult" }
        linked_costs:
          type: array
          items: { $ref: "#/components/schemas/DriverLinkedCost" }
      required: [result, trips, linked_costs]

    AccountsReceivable:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        invoice_id: { $ref: "#/components/schemas/UUID", description: "`fatura_id`." }
        installment_number: { type: integer, description: "`numero_parcela`." }
        value: { type: string, description: "`valor`." }
        received_value: { type: string, readOnly: true, description: "`valor_recebido` — acumulado de baixas (Lote Financeiro, Parte 2.1)." }
        open_balance: { type: string, readOnly: true, description: "`value - received_value`, calculado (Lote Financeiro, Parte 2.1)." }
        due_date: { type: string, format: date, description: "`data_vencimento`." }
        received_at: { type: string, format: date-time, readOnly: true, description: "`data_recebimento` — só quando `received_value == value`." }
        status: { type: string, enum: [PENDENTE, VENCIDA, PARCIALMENTE_RECEBIDO, RECEBIDA, CONCILIADA], readOnly: true, description: "D264 — nunca via PATCH." }
        client_id: { $ref: "#/components/schemas/UUID", description: "Só preenchido por `GET /contas-receber` (Lote Financeiro, Parte 2.1) — `null` nas rotas aninhadas." }
      required: [id, invoice_id, installment_number, value, received_value, open_balance, due_date, status]

    AccountsPayable:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        supplier_id: { $ref: "#/components/schemas/UUID", description: "`fornecedor_id`." }
        cost_center_id: { $ref: "#/components/schemas/UUID", description: "`centro_custo_id`." }
        origin: { type: string, enum: [VIAGEM, ORDEM_SERVICO, ABASTECIMENTO, COMPRA, AJUSTE_MANUAL], description: "`origem` — D099." }
        trip_id: { $ref: "#/components/schemas/UUID", description: "`viagem_id`." }
        maintenance_order_id: { $ref: "#/components/schemas/UUID", description: "`ordem_servico_id`." }
        value: { type: string, description: "`valor`." }
        due_date: { type: string, format: date, description: "`data_vencimento`." }
