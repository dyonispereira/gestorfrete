  # ---------------------------------------------------------------------------
  # Driver Authentication — 054-driver-authentication.md
  # ---------------------------------------------------------------------------
  /mobile/auth/login:
    post:
      tags: [DriverAuthentication]
      summary: Autentica o motorista e inicia uma Sessão Mobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpf: { type: string }
                vehicle_plate: { type: string }
                auth_method: { type: string, enum: [CPF_VEICULO, BIOMETRIA, PIN] }
                credential: { type: string }
                device:
                  type: object
                  properties:
                    device_identifier: { type: string }
                    os: { type: string, enum: [ANDROID, IOS] }
                    os_version: { type: string }
                    app_version: { type: string }
                    push_token: { type: string }
                  required: [device_identifier, os, app_version]
              required: [auth_method, credential, device]
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/MobileSession" }
                  access_token: { type: string }
                  refresh_token: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /mobile/auth/refresh:
    post:
      tags: [DriverAuthentication]
      summary: Renova o par de tokens da Sessão Mobile
      responses:
        "200":
          description: Tokens renovados
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /mobile/auth/logout:
    post:
      tags: [DriverAuthentication]
      summary: Encerra a Sessão Mobile atual (D132 — nunca revoga o dispositivo)
      responses:
        "204": { description: Sessão encerrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /mobile/auth/me:
    get:
      tags: [DriverAuthentication]
      summary: Obtém a Sessão ativa e o motorista autenticado
      responses:
        "200":
          description: Sessão e motorista
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/MobileSession" }
                  driver: { $ref: "#/components/schemas/Driver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

