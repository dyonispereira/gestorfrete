      responses:
        "200":
          description: Ordem de serviço concluída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /ordens-servico/{id}/commands/fechar:
    post:
      tags: [MaintenanceOrders]
      summary: "CONCLUIDA → FECHADA: custos consolidados e lançados no Centro de Custo do veículo"
