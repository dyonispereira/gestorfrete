              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /contas-receber:
    get:
      tags: [AccountsReceivable]
      summary: Consulta agregada de contas a receber entre faturas (Lote Financeiro, Parte 2.1)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDENTE, VENCIDA, PARCIALMENTE_RECEBIDO, RECEBIDA, CONCILIADA] }
        - name: client_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - name: accounting_period
          in: query
          required: false
          description: Igualdade exata — sempre o primeiro dia do mês
          schema: { type: string, format: date }
        - name: due_date__gte
          in: query
          required: false
          schema: { type: string, format: date }
        - name: due_date__lte
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Coleção paginada de contas a receber, entre faturas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AccountsReceivable" }
