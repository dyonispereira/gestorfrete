  # ---------------------------------------------------------------------------
  # Invoices + Accounts Receivable — 033-accounts-receivable.md
  # ---------------------------------------------------------------------------
  /faturas:
    get:
      tags: [Invoices]
      summary: Lista faturas do tenant
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: client_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
        - $ref: "#/components/parameters/StatusFilterParam"
        - name: trip_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UUID" }
          description: "Lote Financeiro, Parte 3 — filtra faturas que têm essa Viagem entre seus itens (`EXISTS` join em `fatura_viagens`), não mais igualdade num `viagem_id` singular."
      responses:
        "200":
          description: Coleção paginada de faturas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Invoices]
      summary: Cria uma fatura, seus itens (`fatura_viagens`) e as contas a receber (parcelas) atomicamente
      description: >
        Lote Financeiro, Parte 3 — Faturamento Agrupado. `trips` (N≥1) substitui o antigo `trip_id`
        singular; faturar uma única Viagem é o caso N=1 do mesmo motor. `total_value` não é mais
        aceito do cliente: o servidor calcula `gross_value = Σ trips[].value` e
        `total_value = gross_value + adjustment_value`. Todas as validações (elegibilidade,
        mesmo cliente, duplicata na seleção, Viagem já faturada) rodam antes de qualquer escrita —
        falha na criação não deixa metade das Viagens faturadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trips:
                  type: array
                  description: "Itens da Fatura — mutuamente exclusivo com `delivery_id`. Cada `trip_id` deve ser elegível (ver `GET /faturas/viagens-elegiveis`), do mesmo `client_id`, e não pode se repetir na lista nem já estar faturado noutra Fatura ativa."
                  items:
                    type: object
                    properties:
                      trip_id: { $ref: "#/components/schemas/UUID" }
                      value: { type: string, description: "Valor faturável do item, > 0 — nunca herdado silenciosamente." }
                    required: [trip_id, value]
                delivery_id: { $ref: "#/components/schemas/UUID", description: "Modo \"por entrega\" — mutuamente exclusivo com `trips`." }
                client_id: { $ref: "#/components/schemas/UUID" }
                adjustment_value: { type: string, default: "0", description: "Ajuste explícito somado ao `gross_value` calculado. Exige `adjustment_reason` quando != 0." }
                adjustment_reason: { type: string, nullable: true }
                payment_method_id: { $ref: "#/components/schemas/UUID" }
                installments:
                  type: array
                  items:
                    type: object
                    properties:
                      value: { type: string }
                      due_date: { type: string, format: date }
                      accounting_period: { type: string, format: date, description: "`competencia` da parcela." }
                    required: [value, due_date, accounting_period]
              required: [client_id, payment_method_id, installments]
      responses:
        "201":
          description: Fatura criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: >
            Requisição inválida — inclui `FINANCIAL_INVOICE_DUPLICATE_TRIP` (mesma Viagem repetida
            em `trips`), `FINANCIAL_INVOICE_ADJUSTMENT_REASON_REQUIRED` (`adjustment_value != 0`
            sem `adjustment_reason`), `FINANCIAL_INVOICE_ORIGIN_MISMATCH` (`trips` e `delivery_id`
            preenchidos simultaneamente, ou nenhum dos dois), `FINANCIAL_INVOICE_TRIP_INVALID_VALUE`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Conflito — inclui `FINANCIAL_INVOICE_CLIENT_MISMATCH` (Viagem não pertence a
            `client_id`), `FINANCIAL_INVOICE_TRIP_ALREADY_INVOICED` (Viagem já é item de outra
            Fatura ativa), `FINANCIAL_INVOICE_MISSING_PRECONDITION` (Viagem sem POD/CT-e
            autorizado — mesma regra de elegibilidade do fluxo individual).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /faturas/viagens-elegiveis:
    get:
      tags: [Invoices]
      summary: Lista Viagens elegíveis para faturamento de um cliente (Lote Financeiro, Parte 3)
      description: >
        Alimenta o picker do wizard "Nova Fatura". Aplica exatamente as mesmas regras de
        elegibilidade de `POST /faturas` (POD registrado, CT-e autorizado, ainda não faturada) —
        nunca uma lista mais permissiva que a criação aceitaria. Registrada antes de
        `/faturas/{id}` na ordem de rotas para não ser capturada como `{invoice_id}`.
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Viagens elegíveis do cliente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EligibleTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /faturas/{id}:
    get:
      tags: [Invoices]
      summary: Obtém uma fatura
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Fatura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

