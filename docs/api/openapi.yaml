  # ---------------------------------------------------------------------------
  /tracking/geofences:
    get:
      tags: [Geofences]
      summary: Lista geofences do tenant
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
