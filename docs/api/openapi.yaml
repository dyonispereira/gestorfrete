    post:
      tags: [MaintenancePreventivePlans]
      summary: Cria um plano de manutenção preventiva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id: { $ref: "#/components/schemas/UUID" }
                vehicle_category_id: { $ref: "#/components/schemas/UUID" }
                trigger_type: { type: string, enum: [QUILOMETRAGEM, HORAS_MOTOR, DIAS, CALENDARIO, MOTOR, TELEMETRIA, RECOMENDACAO_FABRICANTE] }
