name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env: { POSTGRES_USER: gestorfrete, POSTGRES_PASSWORD: gestorfrete, POSTGRES_DB: gestorfrete }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gestorfrete" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env: { RABBITMQ_DEFAULT_USER: gestorfrete, RABBITMQ_DEFAULT_PASS: gestorfrete }
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://gestorfrete:gestorfrete@localhost:5432/gestorfrete
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://gestorfrete:gestorfrete@localhost:5672/
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: gestorfrete
      MINIO_SECRET_KEY: gestorfrete123
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ci-only-secret-never-used-in-production
    steps:
      - uses: actions/checkout@v4
      # A partir de set/2025 a MinIO Inc. passou a exigir login para pull de `minio/minio` tanto no
      # Docker Hub quanto no Quay.io — a Community Edition virou source-only para distribuição
      # livre. Em vez de depender de uma imagem de terceiro ou pinar uma tag antiga sem manutenção,
      # compilamos o binário oficial do zero a cada execução, versão pinada por tag+commit em
      # scripts/ci/build_minio.sh (nunca uma branch flutuante). Roda como processo direto — mais
      # simples que empacotar em imagem quando só os testes Python precisam da porta 9000 aberta.
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: build minio from source
        run: bash scripts/ci/build_minio.sh /tmp/minio-bin
      - name: start minio
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=gestorfrete MINIO_ROOT_PASSWORD=gestorfrete123 \
            nohup /tmp/minio-bin server /tmp/minio-data > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live || (echo "MinIO não respondeu — log:"; cat /tmp/minio.log; exit 1)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install poetry==1.8.3
      - working-directory: apps/api
        run: poetry install
      - name: ruff
        working-directory: apps/api
        run: poetry run ruff check .
      - name: mypy
        working-directory: apps/api
        run: poetry run mypy src
      - name: import-linter
        working-directory: apps/api
        run: PYTHONPATH=src poetry run lint-imports
      - name: alembic upgrade head
        working-directory: apps/api
        run: poetry run alembic upgrade head
      - name: pytest (unit)
        working-directory: apps/api
        run: poetry run pytest -q
      - name: pytest (integration)
        working-directory: apps/api
        run: poetry run pytest -m integration -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: typecheck (web + packages/types)
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: build
        run: pnpm build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # infra/compose/docker-compose.yml referencia minio/minio:latest, que o Docker Hub não deixa
      # mais puxar anonimamente (ver o job backend). Em vez de editar o compose (usado também por
      # devs localmente, onde a imagem já pode estar em cache), compilamos o mesmo binário oficial
      # pinado e o empacotamos numa imagem local com exatamente essa tag — `docker compose up`
      # nunca tenta um pull remoto quando a tag já existe no cache local do daemon.
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: build minio image from source (local tag only, no registry push)
        run: |
          mkdir -p /tmp/minio-image
          bash scripts/ci/build_minio.sh /tmp/minio-image/minio
          # o healthcheck do serviço minio em docker-compose.yml roda `mc ready local` dentro do
          # container — a imagem oficial sempre empacotou minio+mc juntos, então uma imagem só com
          # o servidor nunca passa nesse healthcheck (confirmado: container ficou "Error" depois de
          # 50s/10 tentativas na primeira execução desta correção). `mc ready local` não precisa de
          # nenhuma credencial/env var — testado localmente antes de subir.
          bash scripts/ci/build_mc.sh /tmp/minio-image/mc
          { echo 'FROM alpine:3.20'; \
            echo 'COPY minio /usr/bin/minio'; \
            echo 'COPY mc /usr/bin/mc'; \
            echo 'ENTRYPOINT ["minio"]'; \
          } > /tmp/minio-image/Dockerfile
          docker build -t minio/minio:latest /tmp/minio-image
      - run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.example up -d
      - run: docker compose -f infra/compose/docker-compose.yml exec -T api poetry run alembic upgrade head
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - name: playwright e2e
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps
          # --timeout só aqui, via CLI (playwright.config.ts fica intocado — dev local continua com
          # o default de 30s). Na primeira execução real do CI (36163844400) 6/42 specs falharam,
          # todas com "Test timeout of 30000ms exceeded" ou navegação abortada, nunca uma asserção
          # incorreta — e todas nos primeiros 12 testes; zero falhas do teste 13 em diante (30
          # specs seguidas, incluindo os mesmos arquivos que falharam antes). `next dev` compila
          # cada rota sob demanda na primeira visita — um runner efêmero e frio nunca tinha essa
          # janela de "servidor já aquecido" que toda validação local sempre teve (dev server local
          # roda por dias). CI/ambiente, não aplicação: mesmo binário, mesmos specs, mesmas
          # asserções — só o timeout padrão do Playwright nunca tinha sido testado a frio antes.
          npx playwright test --timeout=90000
