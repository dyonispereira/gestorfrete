# `modules.mobile` é deliberadamente omitido do lado direito (`forbidden_modules`) das listas de
# `interfaces` de outros módulos abaixo — ao contrário de todo módulo anterior, `mobile.application`
# importa `freight.application.commands.*` de propósito (D303/D410: mesma Application Service, dois
# canais). O que nunca pode é `mobile.application` importar `freight.interfaces` (contrato abaixo,
# igual a todo módulo) nem qualquer módulo importar `mobile.interfaces`.

[[tool.importlinter.contracts]]
name = "crm/maintenance/drivers/financial/fleet/freight/documents/tracking/mobile/storage/notification_center/integration/analytics/reporting/ai/shared.addresses application never imports interfaces"
type = "forbidden"
source_modules = [
    "modules.crm.application",
    "modules.maintenance.application",
    "modules.drivers.application",
    "modules.financial.application",
    "modules.fleet.application",
    "modules.freight.application",
    "modules.documents.application",
    "modules.tracking.application",
    "modules.mobile.application",
    "modules.storage.application",
    "modules.notification_center.application",
    "modules.integration.application",
    "modules.analytics.application",
    "modules.reporting.application",
    "modules.ai.application",
    "shared.addresses.application",
]
forbidden_modules = [
    "modules.crm.interfaces",
    "modules.maintenance.interfaces",
    "modules.drivers.interfaces",
    "modules.financial.interfaces",
    "modules.fleet.interfaces",
    "modules.freight.interfaces",
    "modules.documents.interfaces",
    "modules.tracking.interfaces",
    "modules.mobile.interfaces",
    "modules.storage.interfaces",
    "modules.notification_center.interfaces",
    "modules.integration.interfaces",
    "modules.analytics.interfaces",
    "modules.reporting.interfaces",
    "modules.ai.interfaces",
    "shared.addresses.interfaces",
]

# D405 — Lote 8 (Rastreamento). Mecaniza D116/D285 ("Tracking observa, nunca decide o estado
# operacional"): primeiro contrato módulo-inteiro-contra-módulo-inteiro do projeto — os contratos
# acima restringem camada (domain/application) dentro do próprio módulo, nunca um bounded context
# inteiro contra outro. `tracking` (todas as camadas) nunca importa nada de `modules.freight`.
[[tool.importlinter.contracts]]
name = "tracking never imports freight (D116/D285 — tracking observa, nunca decide o estado operacional)"
type = "forbidden"
source_modules = ["modules.tracking"]
forbidden_modules = ["modules.freight"]

# D421 — Lote 11 (BI). Mecaniza D090/D149 ("BI lê os módulos operacionais. Nenhum módulo
# operacional depende de BI."): segundo contrato módulo-inteiro-contra-módulo-inteiro do projeto
# (mesmo formato do D405 acima). Todo módulo operacional é proibido de importar `analytics`/
# `reporting` em qualquer camada — a direção inversa (analytics/reporting importando módulos
# operacionais, ex.: `AnalyticsCalculationEngine` lendo `modules.freight`) permanece livre, é
# exatamente assim que BI lê.
[[tool.importlinter.contracts]]
name = "operational modules never import analytics/reporting (D090/D149/D421 — BI lê, nunca é lido pelos módulos operacionais)"
type = "forbidden"
source_modules = [
    "modules.crm",
    "modules.maintenance",
    "modules.drivers",
    "modules.financial",
    "modules.fleet",
    "modules.freight",
    "modules.documents",
    "modules.tracking",
    "modules.mobile",
    "modules.storage",
    "modules.notification_center",
    "modules.integration",
    "modules.tenancy",
    "modules.identity_access",
]
forbidden_modules = ["modules.analytics", "modules.reporting"]

# D426 — Lote 12 (IA). Mecaniza D161 ("IA nunca decide, nunca altera operação diretamente"):
# terceiro contrato módulo-inteiro-contra-módulo-inteiro do projeto (mesmo formato do D405/D421).
# Todo módulo operacional (incluindo `analytics`/`reporting`, que também nunca decidem por conta
# própria) é proibido de importar `ai` em qualquer camada — a direção inversa (`ai` importando um
# módulo operacional, caso um calculador futuro precise ler dados reais) permanece livre.
[[tool.importlinter.contracts]]
name = "operational modules never import ai (D161/D426 — IA nunca decide, nunca é lida pelos módulos operacionais)"
type = "forbidden"
source_modules = [
    "modules.crm",
    "modules.maintenance",
    "modules.drivers",
    "modules.financial",
    "modules.fleet",
    "modules.freight",
    "modules.documents",
    "modules.tracking",
    "modules.mobile",
    "modules.storage",
    "modules.notification_center",
    "modules.integration",
    "modules.analytics",
    "modules.reporting",
    "modules.tenancy",
    "modules.identity_access",
]
forbidden_modules = ["modules.ai"]
